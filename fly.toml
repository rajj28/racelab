app = "racelab"
primary_region = "sin"          # Singapore: nearest region with capacity to the ap-south-1 cluster

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # A race holds a connection per agent for its duration, and the single-run
  # lock serialises them anyway, so one machine is the correct ceiling. Letting
  # Fly add machines would multiply the cluster's connection load by the number
  # of concurrent visitors.
  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
